<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain For Sale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#c9a84c;
  --gold-light:#e8d48b;
  --dark:#0a0a0f;
  --darker:#06060a;
  --text:#e0ddd5;
  --text-muted:#8a8680;
  --accent:#1a1a24;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--darker);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* Grain overlay */
body::before{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.5;
}

/* Ambient glow */
.glow{
  position:fixed;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,0.07) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
.glow-1{top:-200px;left:50%;transform:translateX(-50%);animation:drift 12s ease-in-out infinite}
.glow-2{bottom:-300px;right:-100px;width:500px;height:500px;animation:drift 15s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}

/* Layout */
.container{
  max-width:900px;margin:0 auto;padding:0 2rem;
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;justify-content:center;
  text-align:center;
}

/* Top line accent */
.top-line{
  position:fixed;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  z-index:10;
}

/* Badge */
.badge{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.5rem 1.4rem;
  border:1px solid rgba(201,168,76,0.25);
  border-radius:100px;
  font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);
  backdrop-filter:blur(10px);
  background:rgba(201,168,76,0.04);
  margin-bottom:2.5rem;
  animation:fadeUp .8s ease both;
}
.badge::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--gold);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Heading */
h1{
  font-family:'Playfair Display',serif;
  font-weight:900;font-size:clamp(2.8rem,7vw,5.5rem);
  line-height:1.05;letter-spacing:-.02em;
  color:#fff;
  margin-bottom:1rem;
  animation:fadeUp .8s .15s ease both;
}
h1 .highlight{
  background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

/* Subtitle */
.subtitle{
  font-size:clamp(1rem,2.2vw,1.25rem);
  color:var(--text-muted);
  font-weight:300;line-height:1.7;
  max-width:560px;
  margin-bottom:3.5rem;
  animation:fadeUp .8s .3s ease both;
}

/* Divider */
.divider{
  width:60px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:0 auto 3rem;
  animation:fadeUp .8s .4s ease both;
}

/* Contact card */
.contact-card{
  background:linear-gradient(145deg,rgba(26,26,36,0.8),rgba(10,10,15,0.9));
  border:1px solid rgba(201,168,76,0.12);
  border-radius:20px;
  padding:2.5rem 3rem;
  backdrop-filter:blur(20px);
  animation:fadeUp .8s .5s ease both;
  width:100%;max-width:520px;
  position:relative;overflow:hidden;
}
.contact-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.3),transparent);
}
.contact-label{
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:1.2rem;
}
.contact-phone{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.4rem,3.5vw,2rem);font-weight:600;
  color:#fff;
  text-decoration:none;
  display:inline-block;
  transition:color .3s;
}
.contact-phone:hover{color:var(--gold)}

.cta-btn{
  display:inline-flex;align-items:center;gap:.6rem;
  margin-top:1.8rem;
  padding:.9rem 2.2rem;
  background:linear-gradient(135deg,var(--gold),#b8943f);
  color:var(--dark);
  font-weight:600;font-size:.9rem;letter-spacing:.04em;
  border:none;border-radius:12px;cursor:pointer;
  text-decoration:none;
  transition:transform .25s,box-shadow .25s;
  box-shadow:0 4px 25px rgba(201,168,76,0.2);
}
.cta-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 35px rgba(201,168,76,0.35);
}
.cta-wa{
  background:linear-gradient(135deg,#25d366,#1ebe57);
  box-shadow:0 4px 25px rgba(37,211,102,0.2);
}
.cta-wa:hover{
  box-shadow:0 8px 35px rgba(37,211,102,0.35);
}
.cta-btn svg{width:16px;height:16px}

/* Footer / Owner */
.owner{
  margin-top:4rem;
  animation:fadeUp .8s .65s ease both;
  display:flex;flex-direction:column;align-items:center;gap:.6rem;
}
.owner-label{
  font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-muted);
}
.owner-name{
  font-family:'Playfair Display',serif;
  font-size:1.15rem;font-weight:600;
  color:var(--gold);
  letter-spacing:.03em;
}
.owner-line{
  width:30px;height:1px;background:rgba(201,168,76,0.25);
}

/* Bottom subtle border */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  padding:1rem;text-align:center;z-index:10;
  font-size:.7rem;color:var(--text-muted);letter-spacing:.08em;
  background:linear-gradient(0deg,var(--darker),transparent);
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:translateY(0)}
}

/* Diamond decorations */
.diamonds{
  display:flex;gap:.4rem;align-items:center;
  margin-bottom:1.5rem;
  animation:fadeUp .8s .1s ease both;
}
.diamond{
  width:5px;height:5px;
  background:var(--gold);
  transform:rotate(45deg);
  opacity:.4;
}
.diamond:nth-child(2){opacity:.7;width:6px;height:6px}
.diamond:nth-child(3){opacity:.4}

@media(max-width:600px){
  .contact-card{padding:2rem 1.5rem}
  .container{padding:0 1.2rem}
}
</style>
</head>
